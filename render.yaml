services:
  - type: web
    name: sorriso-saude
    runtime: node
    plan: 0.5c-512mb
    region: virginia
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: dados-usuarios
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: admin@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_DIR
        value: /var/data
