<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body>
    <form class="login-card" id="login-form">
        <h1>Login</h1>
        <label for="username" class="input-group">E-mail:</label>
        <input type="email" id="username" name="email" autocomplete="email" required>
        <label for="password" class="input-group">Senha:</label>
        <input type="password" id="password" name="password" required>
        <a class="forgot-password-link" href="recuperar-senha.html">Esqueci a senha</a>
        <label for="remember-device" class="remember-device">
            <input type="checkbox" id="remember-device" name="remember-device">
            Lembrar neste dispositivo
        </label>
        <label for="accept-terms" class="terms-acceptance">
            <input type="checkbox" id="accept-terms" name="accept-terms" required>
            <span>Li e concordo com os <a href="termos.html">termos</a>.</span>
        </label>
        <button type="submit" class="btn">Entrar</button>
        <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
        <p class="signup-link">Não tem conta? <a href="cadastrar.html">Cadastre-se</a></p>
    </form>
    <script>
        if (new URLSearchParams(window.location.search).get("termos") === "aceitos") {
            document.getElementById("accept-terms").checked = true;
        }

        document.getElementById("login-form").addEventListener("submit", async function (event) {
            event.preventDefault();
            const message = document.getElementById("login-message");
            const formData = new FormData(event.currentTarget);
            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: formData.get("email"),
                        password: formData.get("password"),
                        termsAccepted: formData.get("accept-terms") === "on"
                    })
                });
                if (!response.headers.get("content-type")?.includes("application/json")) {
                    message.textContent =
                        "Servidor da aplicação não encontrado. Rode powershell -ExecutionPolicy Bypass -File iniciar.ps1 e abra http://localhost:3000.";
                    return;
                }
                const result = await response.json();
                if (!response.ok) {
                    message.textContent = result.error || "Não foi possível entrar.";
                    return;
                }
                window.location.assign("dashboard.html");
            } catch (error) {
                message.textContent = error instanceof TypeError
                    ? "Servidor indisponível. Rode powershell -ExecutionPolicy Bypass -File iniciar.ps1 e abra http://localhost:3000."
                    : "Não foi possível concluir o login. Tente novamente.";
            }
        });
    </script>
</body>
</html>
